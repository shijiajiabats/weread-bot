name: WeRead Bot - Daily Reading

on:
  schedule:
    - cron: '47 22 * * *' # UTC 22:47 = 次日北京时间 06:47；随机延迟后约 06:57-07:17 开始
  workflow_dispatch:
    inputs:
      target_duration:
        description: '手动运行的阅读时长（分钟）'
        required: false
        default: '5-10'
        type: string

permissions:
  contents: read

jobs:
  daily-reading:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve runtime parameters
        env:
          INPUT_TARGET_DURATION: ${{ inputs.target_duration }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            target_duration="60-90"
            startup_delay="600-1800"
          else
            target_duration="${INPUT_TARGET_DURATION:-5-10}"
            startup_delay="1-2"
          fi

          echo "TARGET_DURATION=${target_duration}" >> "$GITHUB_ENV"
          echo "STARTUP_DELAY=${startup_delay}" >> "$GITHUB_ENV"

      - name: Create runtime configuration
        run: |
          cat > config.yaml <<EOF
          app:
            name: "WeReadBot-GitHub-Action"
            startup_mode: "immediate"
            startup_delay: "${STARTUP_DELAY}"

          reading:
            mode: "smart_random"
            target_duration: "${TARGET_DURATION}"
            reading_interval: "30-48"
            use_curl_data_first: true
            fallback_to_config: true
            smart_random:
              book_continuity: 0.8
              chapter_continuity: 0.7
              book_switch_cooldown: 3600

          human_simulation:
            enabled: false
            reading_speed_variation: true
            break_probability: 0.15
            break_duration: "10-20"
            rotate_user_agent: false

          network:
            timeout: 30
            retry_times: 3
            retry_delay: "5-15"
            rate_limit: 10

          notification:
            enabled: true
            include_statistics: true
            only_on_failure: true
            triggers:
              session_success: false
              multi_user_summary: false
              session_failure: true
              runtime_error: true
              general: true

          logging:
            level: "ERROR"
            format: "detailed"
            file: "logs/weread.log"
            max_size: "10MB"
            backup_count: 1
            console: true

          history:
            enabled: false
            file: "logs/run-history.json"
            max_entries: 10
            persist_runtime_error: false
          EOF

      - name: Run WeRead Bot
        env:
          WEREAD_CURL_STRING: ${{ secrets.WEREAD_CURL_STRING }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          NOTIFICATION_ONLY_ON_FAILURE: 'true'
          TZ: Asia/Shanghai
        run: python weread-bot.py --config config.yaml
