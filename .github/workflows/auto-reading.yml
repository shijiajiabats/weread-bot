name: WeRead Bot - Manual Validation

on:
  workflow_dispatch:
    inputs:
      target_duration:
        description: '测试阅读时长（分钟）'
        required: false
        default: '5-10'
        type: string

permissions:
  contents: read

jobs:
  manual-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test configuration
        env:
          TARGET_DURATION: ${{ inputs.target_duration || '5-10' }}
        run: |
          cat > config.yaml <<EOF
          app:
            name: "WeReadBot-GitHub-Action"
            startup_mode: "immediate"
            startup_delay: "1-2"

          reading:
            mode: "smart_random"
            target_duration: "${TARGET_DURATION}"
            reading_interval: "30-48"
            use_curl_data_first: true
            fallback_to_config: true
            smart_random:
              book_continuity: 0.8
              chapter_continuity: 0.7
              book_switch_cooldown: 3600

          human_simulation:
            enabled: false
            reading_speed_variation: true
            break_probability: 0.15
            break_duration: "10-20"
            rotate_user_agent: false

          network:
            timeout: 30
            retry_times: 3
            retry_delay: "5-15"
            rate_limit: 10

          notification:
            enabled: true
            include_statistics: true
            only_on_failure: false
            triggers:
              session_success: true
              multi_user_summary: true
              session_failure: true
              runtime_error: true
              general: true

          logging:
            level: "ERROR"
            format: "detailed"
            file: "logs/weread.log"
            max_size: "10MB"
            backup_count: 1
            console: true

          history:
            enabled: false
            file: "logs/run-history.json"
            max_entries: 10
            persist_runtime_error: false
          EOF

      - name: Run validation
        env:
          WEREAD_CURL_STRING: ${{ secrets.WEREAD_CURL_STRING }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          NOTIFICATION_ONLY_ON_FAILURE: 'false'
          TZ: Asia/Shanghai
        run: python weread-bot.py --config config.yaml
